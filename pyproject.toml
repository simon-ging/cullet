[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cullet"
description = "Keyboard-driven photo viewer for culling, sorting, tagging and deduplicating."
readme = "README.md"
authors = [{ "name" = "simon-ging" }]
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["photo", "image", "viewer", "culling", "duplicates"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Graphics :: Viewers",
]
dependencies = ["PySide6", "Pillow", "natsort", "typedparser"]
dynamic = ["version"]

[project.optional-dependencies]
dedup = ["torch", "torchvision", "tqdm"]
dev = ["pytest", "numpy"]

[project.scripts]
cullet = "cullet.cli:main"

[project.urls]
Project-URL = "https://github.com/simon-ging/cullet"

[tool.setuptools.dynamic]
version = { attr = "cullet.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
