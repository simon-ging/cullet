[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cullet"
description = "Keyboard-driven photo viewer for culling, sorting, tagging and deduplicating."
readme = "README.md"
authors = [{ "name" = "simon-ging" }]
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["photo", "image", "viewer", "culling", "duplicates"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Graphics :: Viewers",
]
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
full = ["torch", "torchvision", "tqdm", "numpy"]
dev = ["pytest", "pytest-cov", "pylint", "numpy"]

[project.scripts]
cullet = "cullet.cli:main"
cullet-dedup-images = "cullet.cli_dedup_images:main"
cullet-dedup-videos = "cullet.cli_dedup_videos:main"
cullet-fix-rotation-images = "cullet.extras:fix_rotation_images"
cullet-fix-rotation-videos = "cullet.extras:fix_rotation_videos"
cullet-downscale-images = "cullet.cli_downscale_images:main"
cullet-downscale-videos = "cullet.cli_downscale_videos:main"

[project.urls]
Project-URL = "https://github.com/simon-ging/cullet"

[tool.setuptools]
zip-safe = true
platforms = ["any"]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "cullet.__version__" }
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.coverage.run]
source_pkgs = ["cullet"]
branch = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.html]
directory = ".covreport"

[tool.coverage.xml]
output = ".covreport/coverage.xml"

[tool.pylint.main]
jobs = 1
extension-pkg-allow-list = ["PySide6"]

[tool.pylint.messages_control]

enable = "all"

disable = [
    'suppressed-message', 'locally-disabled', 'line-too-long', 'missing-module-docstring',
    'missing-class-docstring', 'missing-function-docstring', 'fixme',
    'f-string-without-interpolation', 'invalid-name',
    'logging-fstring-interpolation', 'consider-iterating-dictionary',
    'use-implicit-booleaness-not-comparison',
    'attribute-defined-outside-init', 'consider-using-with', 'global-statement',
    'import-outside-toplevel', 'super-init-not-called', 'broad-exception-caught',
    'disallowed-name', 'redefined-outer-name', 'use-implicit-booleaness-not-comparison-to-zero',
    'eval-used', 'unknown-option-value', 'arguments-differ', 'subprocess-run-check',
    'use-implicit-booleaness-not-comparison-to-string', 'use-dict-literal',
    'useless-suppression', 'too-many-positional-arguments', 'use-symbolic-message-instead',
]

[tool.pylint.format]
max-line-length = 99999
max-module-lines = 99999

[tool.pylint.refactoring]
max-nested-blocks = 9999

[tool.pylint.design]
max-args = 9999
max-attributes = 9999
max-bool-expr = 9999
max-branches = 9999
max-locals = 9999
max-parents = 9999
max-public-methods = 9999
max-returns = 9999
max-statements = 9999
min-public-methods = 0
