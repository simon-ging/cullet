name: full build for python 3.14

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen  # the runner has no display
      CULLET_FULL_BUILD: 1  # a skipped test fails the run
    steps:
#
    - name: Checkout code
      uses: actions/checkout@v4
#
    - name: Install system libraries for Qt, jpegtran and ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libjpeg-turbo-progs ffmpeg
#
    - name: Setup uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.14"
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          requirements.txt
#
    - name: Install code
      run: |
        uv venv .venv
        uv pip install --python .venv torch torchvision --index-url https://download.pytorch.org/whl/cpu
        uv pip install --python .venv -e ".[full,dev]"
#
    - name: Pip list
      run: uv pip list --python .venv
#
    - name: Run pytest
      run: |
        .venv/bin/python -m pytest tests --cov -rs
#
    - name: Run pylint
      continue-on-error: true
      run: |
        .venv/bin/pylint src
        .venv/bin/pylint tests
#
